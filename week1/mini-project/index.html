<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Mini Project - Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Smart Todo App</h1>

    <div class="todo-input">
      <input id="task-input" placeholder="Enter a new task">
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="done">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <p id="task-count"></p>
      <button id="clear-completed">Clear Completed</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
